name: atmos_trs_system
description: "ATMOS TRS"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  form_validator: ^2.1.1
  step_progress_indicator: ^1.0.2
  shared_preferences: ^2.2.2

  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  google_maps_flutter: 2.10.1

  webview_flutter: ^4.4.2
  webview_flutter_android: ^3.14.0
  webview_flutter_wkwebview: ^3.9.0

  url_launcher: ^6.2.4

  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  cloud_functions: ^5.1.4
  firebase_auth: ^5.7.0
  firebase_storage: ^12.3.6
  firebase_messaging: ^15.2.10

  flutter_local_notifications: ^21.0.0

  qr_flutter: ^4.1.0
  uuid: ^4.2.1

  image_picker: ^1.0.7
  image: ^4.1.3
  image_gallery_saver_plus: ^4.0.1
  cached_network_image: ^3.4.1

  panorama_viewer: ^2.0.7
  mobile_scanner: ^7.2.0

  printing: ^5.13.0
  pdf: ^3.10.7

  http: ^1.2.2
  share_plus: ^12.0.1
  path_provider: ^2.1.5
  cross_file: ^0.3.5+2

  video_player: ^2.9.2
  geolocator: ^13.0.2

  smooth_page_indicator: ^1.1.0
  fl_chart: ^0.69.0

  trip_plan:
    path: lib/tripplan/main
  google_fonts: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/images/logo.png"
    background_color: "#ffffff"
    theme_color: "#1565C0"

dependency_overrides:
  google_maps_flutter_web: 0.5.14+2

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/vr_tour/
    - assets/Onboarding_screen/
    - assets/Nearby Hotel's in Sunrise Beach/

  fonts:
    - family: Sacrifice
      fonts:
        - asset: assets/fonts/sacrifice-font/SacrificeDemo-8Ox1B.ttf

    - family: Ananda Black
      fonts:
        - asset: assets/fonts/ananda-black-font/AnandaBlackPersonalUseRegular-rg9Rx.ttf