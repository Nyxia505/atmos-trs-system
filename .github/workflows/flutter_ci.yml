name: Validate

on:
  pull_request:
  push:
    branches:
      - main
      - feature/atmos-trs
      - feature/trip-planner

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: find test -name '*_test.dart' ! -name 'widget_test.dart' -print0 | xargs -0 flutter test
