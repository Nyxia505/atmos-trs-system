# This PC reports about 7 GB RAM. 1024m OOMs R8 (Java heap space).
# 1536m plus TieredStopAtLevel=1 lets assembleRelease finish without
# the old native C2 crash (hs_err: malloc failed in arena.cpp).
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=64m -XX:TieredStopAtLevel=1 -XX:+UseSerialGC -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx384m
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.workers.max=1
android.useAndroidX=true
android.enableJetifier=false
kotlin.jvm.target.validation.mode=warning
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
