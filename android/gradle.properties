# Keep heaps modest on ~8GB Windows machines. Oversized Gradle/Kotlin heaps
# starve the Dart VM during `flutter run` and cause "Out of memory" / zone.cc crashes.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=192m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx768m
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.workers.max=2
android.useAndroidX=true
android.enableJetifier=false
kotlin.jvm.target.validation.mode=warning
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
