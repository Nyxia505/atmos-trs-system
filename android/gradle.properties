# This PC reports about 7 GB RAM. A 1536m Gradle heap plus the Kotlin daemon
# left no native memory, so the R8 C2 compiler thread crashed the daemon
# (hs_err: malloc failed in arena.cpp). TieredStopAtLevel=1 skips that C2 JIT.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=256m -XX:ReservedCodeCacheSize=64m -XX:TieredStopAtLevel=1 -XX:+UseSerialGC -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx384m
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.workers.max=1
android.useAndroidX=true
android.enableJetifier=false
kotlin.jvm.target.validation.mode=warning
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
